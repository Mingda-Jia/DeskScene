name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test DeskScene.slnx -c Release

      - name: Publish single-file exe
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { @("-p:Version=$($env:GITHUB_REF_NAME.TrimStart('v'))") } else { @() }
          dotnet publish src/DeskScene -c Release -r win-x64 -p:PublishSingleFile=true @version -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: DeskScene
          path: publish/DeskScene.exe

      - name: Create release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} publish/DeskScene.exe --title "DeskScene ${{ github.ref_name }}" --generate-notes
